[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geotrace-desktop"
version = "1.1.0"
description = "Georeferenced map digitization and editing"
requires-python = ">=3.11,<3.14"
dependencies = [
  "certifi>=2024.2.2", "PySide6>=6.12,<6.13", "rasterio>=1.4,<2", "fiona>=1.10,<2",
  "shapely>=2.0,<3", "numpy>=1.26,<3", "scipy>=1.14,<2",
  "opencv-python-headless>=4.10,<5", "pillow>=11,<13", "scikit-image>=0.24,<0.27",
  "pyproj>=3.7,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1"]
packaging = ["pyinstaller>=6.22,<7", "markdown>=3.7,<4"]
research = ["torch>=2.6,<3", "torchvision>=0.21,<1", "timm>=1,<2", "psutil>=6,<8"]

[project.scripts]
geotrace = "geotrace.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geotrace = ["build_info.json", "qml/*.qml", "qml/*.png", "qml/icons/*.svg", "webmap/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
