name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,packaging]"
      - run: python -m pytest -q tests/test_raster_colors.py
      - run: python tools/check_suite.py
      - name: Stamp build identity
        run: python tools/write_build_info.py --number ${{ github.run_number }} --commit ${{ github.sha }} --run-url https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - id: version
        shell: bash
        run: python -c "import geotrace,os; open(os.environ['GITHUB_OUTPUT'],'a').write('version='+geotrace.__version__+'\n')"
      - run: python -m build
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis --yes --no-progress --limit-output
            $paths = @("${env:ProgramFiles(x86)}/NSIS/makensis.exe", "$env:ProgramFiles/NSIS/makensis.exe")
            $compiler = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($compiler) { "NSIS_HOME=$(Split-Path $compiler)" >> $env:GITHUB_ENV; exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
          }
          throw 'NSIS installation failed after three attempts'
      - name: Build and check native distribution
        run: python tools/build_desktop.py
      - name: Check Windows installer payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/desktop/*-Setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'GeoTraceInstalled'
          $process = Start-Process $setup.FullName -ArgumentList @('/S', "/D=$destination") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          # Exercise repair/update, removal of omitted old libraries and the
          # previous per-user installation, without launching its uninstaller.
          $legacy = Join-Path $env:LOCALAPPDATA 'Programs/GeoTraceLegacyCheck'
          New-Item -ItemType Directory -Force "$legacy/_internal" | Out-Null
          Copy-Item "$destination/GeoTrace.exe" "$legacy/GeoTrace.exe"
          Set-Content "$legacy/Uninstall.exe" 'not executed'
          Set-Content "$legacy/project.geotrace" 'preserve project'
          Set-Content "$destination/_internal/obsolete-update-check.txt" 'remove old payload'
          New-Item -Path 'HKCU:/Software/GeoTrace' -Force | Out-Null
          New-ItemProperty -Path 'HKCU:/Software/GeoTrace' -Name InstallDir -Value $legacy -PropertyType String -Force | Out-Null
          New-Item -Path 'HKCU:/Software/GeoTrace/GeoTrace' -Force | Out-Null
          New-ItemProperty -Path 'HKCU:/Software/GeoTrace/GeoTrace' -Name UpgradeSentinel -Value 'preserve settings' -PropertyType String -Force | Out-Null
          $upgrade = Start-Process $setup.FullName -ArgumentList @('/S', "/D=$destination") -PassThru -Wait
          if ($upgrade.ExitCode -ne 0) { throw 'Upgrade failed' }
          if (Test-Path "$destination/_internal/obsolete-update-check.txt") { throw 'Old libraries survived upgrade' }
          if (Test-Path "$legacy/GeoTrace.exe") { throw 'Per-user application was not migrated' }
          if (!(Test-Path "$legacy/project.geotrace")) { throw 'Project was removed during migration' }
          if ((Get-ItemPropertyValue -Path 'HKCU:/Software/GeoTrace/GeoTrace' -Name UpgradeSentinel) -ne 'preserve settings') { throw 'Settings were removed' }
          if ((Get-ItemPropertyValue -Path 'HKLM:/Software/GeoTrace' -Name InstallDir) -ne $destination) { throw 'Machine registration is missing' }
          python tools/smoke_frozen.py "$destination/GeoTrace.exe" --report dist/desktop/installed-Windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed application check failed' }
      - name: Check macOS installer payload
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo installer -pkg dist/desktop/*.pkg -target /
          # Mimic an older bundle and a file omitted by the new version. The
          # next installation must replace the whole bundle and restore signing.
          sudo /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 0.0.1' /Applications/GeoTrace.app/Contents/Info.plist
          sudo /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 0' /Applications/GeoTrace.app/Contents/Info.plist
          sudo touch /Applications/GeoTrace.app/Contents/Resources/obsolete-update-check.txt
          sudo installer -pkg dist/desktop/*.pkg -target /
          test ! -e /Applications/GeoTrace.app/Contents/Resources/obsolete-update-check.txt
          codesign --verify --deep --strict /Applications/GeoTrace.app
          python tools/smoke_frozen.py /Applications/GeoTrace.app/Contents/MacOS/GeoTrace --report dist/desktop/installed-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview-${{ matrix.os }}
          path: dist/desktop/selfcheck-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/desktop/*
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ matrix.os }}
          path: dist/*.whl
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            test-screenshots/*
            build/pyinstaller/GeoTrace/warn-GeoTrace.txt
            dist/desktop/*.json
          if-no-files-found: ignore
  documents:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Use visually checked release documents
        shell: bash
        run: |
          python3 tools/check_user_documents.py --output dist/documents
      - uses: actions/upload-artifact@v4
        with:
          name: user-documents
          path: dist/documents/*
