name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_raster_colors.py
      - run: python -m pytest -q
      - name: Stamp build identity
        run: python tools/write_build_info.py --number ${{ github.run_number }} --commit ${{ github.sha }} --run-url https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ matrix.os }}
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots-${{ matrix.os }}
          path: test-screenshots/*
          if-no-files-found: ignore
